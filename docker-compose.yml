# Deployment with the images built by CI (GitHub Actions -> ghcr.io).
#   docker login ghcr.io          # the package is private: token with read:packages
#   docker compose pull && docker compose up -d
# ZUKAN_TAG in .env pins a version (e.g. 0.1.0) or tests a dev build (dev-<branch>).
# To build from source instead, use docker-compose-dev.yml.
# Data lives next to this file: ./data/postgres (database) and ./data/images (card images).
# First start creates the administrator admin / changeme: change its password.
# All settings come from .env (documented in .env.example).
name: zukan

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: tcg
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg"]
      interval: 5s
      retries: 10

  api:
    image: ghcr.io/foxops/zukan:${ZUKAN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://tcg:${POSTGRES_PASSWORD}@db:5432/tcg
    volumes:
      - ./data/images:/data/images
      # Put downloaded image folders here (e.g. Sorcery Google Drive) to import them.
      - ./import:/data/import:ro
    ports:
      - "${ZUKAN_PORT:-8000}:8000"

  # Refreshes catalogs, prices and owned card images (TCG_SYNC_INTERVAL_HOURS).
  worker:
    image: ghcr.io/foxops/zukan:${ZUKAN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://tcg:${POSTGRES_PASSWORD}@db:5432/tcg
    volumes:
      - ./data/images:/data/images
    command: ["python", "-m", "app.worker"]
