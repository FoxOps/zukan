# Deployment with the images built by CI (GitHub Actions -> ghcr.io).
#   docker login ghcr.io          # the package is private: token with read:packages
#   docker compose pull && docker compose up -d
# ZUKAN_TAG in .env pins a version (e.g. 0.1.0) or tests a dev build (dev-<branch>).
# To build from source instead, use docker-compose-dev.yml.
# Data lives next to this file: ./data/postgres (database), ./data/images (card images)
# and ./data/init (generated on the first start).
# First start writes the password of the administrator `admin` to
# ./data/init/initial-admin-password, unless TCG_DEFAULT_ADMIN_PASSWORD is set: sign in and
# change it (the file is then deleted).
# The API and worker use a database role that only reads and writes data
# (TCG_DB_APP_PASSWORD); the `migrate` service sets it up with the owner role.
# All settings come from .env (documented in .env.example).
name: zukan

# Container logs are rotated: at most 3 files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: tcg
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg"]
      interval: 5s
      retries: 10

  # Database migrations and the runtime role of the API and worker, with the owner role
  # (a superuser). Runs on every start, then exits.
  migrate:
    image: ghcr.io/foxops/zukan:${ZUKAN_TAG:-latest}
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://tcg:${POSTGRES_PASSWORD}@db:5432/tcg
      TCG_DB_APP_PASSWORD: ${TCG_DB_APP_PASSWORD:?set in .env}
    command: ["sh", "-c", "alembic upgrade head && zukan db-roles"]

  api:
    image: ghcr.io/foxops/zukan:${ZUKAN_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://zukan_app:${TCG_DB_APP_PASSWORD}@db:5432/tcg
      # Proxies trusted for X-Forwarded-For / -Proto (see .env.example).
      FORWARDED_ALLOW_IPS: ${TCG_FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ./data/images:/data/images
      # What the first start generates: the administrator's password
      # (initial-admin-password) when TCG_DEFAULT_ADMIN_PASSWORD is not set.
      - ./data/init:/data/init
      # Put downloaded image folders here (e.g. Sorcery Google Drive) to import them.
      - ./import:/data/import:ro
    ports:
      # Only on this machine by default: the reverse proxy (Caddy...) runs here. Set
      # ZUKAN_BIND=0.0.0.0 to reach it from other machines (see .env.example).
      - "${ZUKAN_BIND:-127.0.0.1}:${ZUKAN_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      # Database migrations run before the server starts.
      start_period: 120s
    # Memory cap, if the host is shared (idle the API uses about 100 MB):
    # mem_limit: 1g

  # Refreshes catalogs, prices and owned card images (TCG_SYNC_INTERVAL_HOURS).
  worker:
    image: ghcr.io/foxops/zukan:${ZUKAN_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      # Starts once the migrations (migrate service, before the API) are done.
      api:
        condition: service_healthy
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://zukan_app:${TCG_DB_APP_PASSWORD}@db:5432/tcg
    volumes:
      - ./data/images:/data/images
    command: ["python", "-m", "app.worker"]
    # Memory cap, if the host is shared: leave room for catalog refreshes (Magic's is
    # the largest).
    # mem_limit: 1500m

networks:
  default:
    driver_opts:
      # Below 1500 so the server also works when the host goes through a VPN tunnel.
      # Lower it for tunnels with less room.
      com.docker.network.driver.mtu: ${TCG_NETWORK_MTU:-1420}
