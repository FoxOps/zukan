# Dev server image from a development branch (pick it in "Use workflow from").
# Quick checks for breaking bugs, then an amd64 image pushed as dev-<branch> and
# dev-<branch>-<sha>. On success the Release workflow publishes pre-release
# server-dev-<branch> (replaced by each new dev build of that branch).
name: Docker dev

on:
  workflow_dispatch:

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.guard.outputs.slug }}
      short_sha: ${{ steps.guard.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        env:
          BRANCH: ${{ github.ref_name }}
        run: scripts/ci/guard.sh dev "$BRANCH"

  checks:
    needs: guard
    uses: ./.github/workflows/_checks.yml
    with:
      full: false

  image:
    needs: [guard, checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      tags: dev-${{ needs.guard.outputs.slug }},dev-${{ needs.guard.outputs.slug }}-${{ needs.guard.outputs.short_sha }}
      platforms: linux/amd64
      version: dev-${{ needs.guard.outputs.slug }}

  release-info:
    name: Hand over to the release
    needs: [guard, image]
    runs-on: ubuntu-latest
    steps:
      - name: Release notes
        env:
          SLUG: ${{ needs.guard.outputs.slug }}
          SHORT_SHA: ${{ needs.guard.outputs.short_sha }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          mkdir release
          echo server > release/component
          echo dev > release/channel
          echo "dev-$SLUG" > release/version
          echo "Dev build of branch \`$GITHUB_REF_NAME\` at $SHORT_SHA. Docker image: \`$IMAGE:dev-$SLUG\` (also \`$IMAGE:dev-$SLUG-$SHORT_SHA\`, linux/amd64)" > release/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-docker
          path: release/
          retention-days: 7
