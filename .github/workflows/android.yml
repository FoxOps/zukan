# Fudabako Android app, started by hand.
#
#   dev  : pick a development branch in "Use workflow from". Unit tests and a debug
#          build of "Fudabako dev" (fr.fudabako.app.dev, installs next to the released
#          app), uploaded as a workflow artifact.
#   prod : from main with a version. Lint, all unit tests, signed R8 release build,
#          attached to GitHub Release v<version> with its R8 mapping file.
#
# Signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD (required for prod; dev builds use them when present so successive
# dev builds update each other).
name: Android app

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "dev = selected branch, quick checks · prod = main, full tests and release"
        type: choice
        options: [dev, prod]
        default: dev
      version:
        description: "Release version X.Y.Z (prod only)"
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Check branch and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      version_code: ${{ steps.guard.outputs.version_code }}
      slug: ${{ steps.guard.outputs.slug }}
      short_sha: ${{ steps.guard.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        # Inputs and branch names go through env, never straight into the script.
        env:
          CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: scripts/ci/guard.sh "$CHANNEL" "$BRANCH" "$VERSION"

  build:
    name: ${{ inputs.channel == 'prod' && 'Test and release build' || 'Test and dev build' }}
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release (prod)
    defaults:
      run:
        working-directory: android
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.guard.outputs.version }}
      VERSION_CODE: ${{ needs.guard.outputs.version_code }}
      SLUG: ${{ needs.guard.outputs.slug }}
      SHORT_SHA: ${{ needs.guard.outputs.short_sha }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$CHANNEL" = prod ]; then
              echo "::error::Prod builds must be signed: add the ANDROID_KEYSTORE_* secrets."
              exit 1
            fi
            echo "::warning::No signing secrets: dev build signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Dev build
        if: inputs.channel == 'dev'
        run: |
          ./gradlew testDebugUnitTest assembleDebug \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionNameSuffix="-dev.$SHORT_SHA"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/fudabako-dev-$SLUG-$SHORT_SHA.apk"

      - name: Release build
        if: inputs.channel == 'prod'
        run: |
          ./gradlew lintRelease testDebugUnitTest testReleaseUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fudabako-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$VERSION.txt"

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.channel == 'prod' && format('fudabako-{0}', needs.guard.outputs.version) || format('fudabako-dev-{0}-{1}', needs.guard.outputs.slug, needs.guard.outputs.short_sha) }}
          path: android/dist/
          retention-days: ${{ inputs.channel == 'prod' && 90 || 14 }}

      - name: GitHub Release
        if: inputs.channel == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ../scripts/ci/release.sh "$VERSION" "Android app: \`fudabako-$VERSION.apk\` (version code $VERSION_CODE)" \
            "dist/fudabako-$VERSION.apk" "dist/mapping-$VERSION.txt"

      - name: Summary
        run: |
          {
            echo "### Android app ($CHANNEL)"
            for f in dist/*; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"
