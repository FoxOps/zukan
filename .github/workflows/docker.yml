# Fudabako server image (API + worker + web UI), started by hand.
#
#   dev  : pick a development branch in "Use workflow from". Quick checks for breaking
#          bugs (lint, smoke tests, type check, container smoke test), amd64 image
#          pushed as dev-<branch> and dev-<branch>-<sha>.
#   prod : from main with a version. Full lint and tests, migrations check, container
#          smoke test, amd64 + arm64 image pushed as latest, <version>, sha-<sha>, and
#          GitHub Release v<version>.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "dev = selected branch, quick checks · prod = main, full tests and release"
        type: choice
        options: [dev, prod]
        default: dev
      version:
        description: "Release version X.Y.Z (prod only)"
        type: string
        required: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  guard:
    name: Check branch and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      slug: ${{ steps.guard.outputs.slug }}
      short_sha: ${{ steps.guard.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        # Inputs and branch names go through env, never straight into the script.
        env:
          CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: scripts/ci/guard.sh "$CHANNEL" "$BRANCH" "$VERSION"

  test:
    name: Tests (${{ inputs.channel == 'prod' && 'full' || 'smoke' }})
    needs: guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcg" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: tcg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        # Same layout as local development (web's gen:api uses backend/.venv).
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Create test database
        run: psql -h localhost -U tcg -d tcg -c "CREATE DATABASE tcg_test"
      - name: Lint
        working-directory: backend
        run: .venv/bin/ruff check .
      - name: Formatting and migrations
        if: inputs.channel == 'prod'
        working-directory: backend
        env:
          TCG_DATABASE_URL: postgresql+asyncpg://tcg:tcg@localhost:5432/tcg
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: Tests
        working-directory: backend
        run: .venv/bin/pytest -q ${{ inputs.channel == 'dev' && '-m smoke' || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx tsc -b
      - name: Lint, build and API types
        if: inputs.channel == 'prod'
        working-directory: web
        run: |
          npx oxlint src
          npx vite build
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date: run 'npm run gen:api' and commit it."
            exit 1
          }

  image:
    name: Build and publish image
    needs: [guard, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release (prod)
      packages: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcg" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        # GHCR names must be lowercase (the owner is FoxOps).
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
        if: inputs.channel == 'prod'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.guard.outputs.version }}
          SLUG: ${{ needs.guard.outputs.slug }}
          SHORT_SHA: ${{ needs.guard.outputs.short_sha }}
        run: |
          if [ "$CHANNEL" = prod ]; then
            tags="$IMAGE:latest,$IMAGE:$VERSION,$IMAGE:sha-$SHORT_SHA"
            platforms=linux/amd64,linux/arm64
          else
            tags="$IMAGE:dev-$SLUG,$IMAGE:dev-$SLUG-$SHORT_SHA"
            platforms=linux/amd64
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fudabako:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: scripts/ci/docker-smoke.sh fudabako:ci

      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.tags.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version || format('dev-{0}', needs.guard.outputs.slug) }}
            org.opencontainers.image.title=Fudabako
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        if: inputs.channel == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          scripts/ci/release.sh "$VERSION" "Docker image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)"

      - name: Summary
        env:
          CHANNEL: ${{ inputs.channel }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "### Docker image ($CHANNEL)"
            echo "${TAGS//,/$'\n'}" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
