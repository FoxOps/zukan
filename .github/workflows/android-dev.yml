# Dev Android app from a development branch (pick it in "Use workflow from").
# Unit tests and a debug build of "Zukan dev" (fr.zukan.app.dev, installs next to
# the released app). On success the Release workflow publishes it as pre-release
# android-dev-<branch> (replaced by each new dev build of that branch).
name: Android dev

on:
  workflow_dispatch:

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.guard.outputs.slug }}
      short_sha: ${{ steps.guard.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        env:
          BRANCH: ${{ github.ref_name }}
        run: scripts/ci/guard.sh dev "$BRANCH"

  build:
    name: Unit tests and dev build
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      SLUG: ${{ needs.guard.outputs.slug }}
      SHORT_SHA: ${{ needs.guard.outputs.short_sha }}
      # Signing with the release key (when set) lets dev builds update each other.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - name: Signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: dev build signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests and build
        run: |
          ./gradlew testDebugUnitTest assembleDebug \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionNameSuffix="-dev.$SHORT_SHA"
          mkdir -p release
          echo android > release/component
          echo dev > release/channel
          echo "dev-$SLUG" > release/version
          echo "Dev build of branch \`$GITHUB_REF_NAME\` at $SHORT_SHA: \`zukan-dev-$SLUG-$SHORT_SHA.apk\` (Zukan dev, installs next to the released app)." > release/notes.md
          cp app/build/outputs/apk/debug/app-debug.apk "release/zukan-dev-$SLUG-$SHORT_SHA.apk"
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: android/release/
          retention-days: 14
      - name: Summary
        run: |
          for f in release/*.apk; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done >> "$GITHUB_STEP_SUMMARY"
