# Publish a GitHub Release when a prod build succeeds. Docker prod and Android prod hand
# over a "release-*" artifact (component, version, notes, files). The server and the
# Android app are versioned independently: server-v<version> and android-v<version>.
name: Release

on:
  workflow_run:
    workflows: ["Docker prod", "Android prod"]
    types: [completed]

# One release update at a time, so two prod builds finishing together don't race.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          component=$(cat release/component)
          version=$(cat release/version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version '$version'"; exit 1; }
          notes=$(cat release/notes.md)
          mapfile -t files < <(find release -type f ! -name component ! -name version ! -name notes.md | sort)
          scripts/ci/release.sh "$component" "$version" "$notes" "${files[@]}"
          tag="$component-v$version"
          echo "Release [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) updated from $BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
