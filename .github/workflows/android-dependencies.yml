# Android dependency graph: the resolved Gradle runtime dependencies (transitive ones too,
# such as Guava brought by CameraX) go to GitHub's dependency graph, so Dependabot alerts
# cover what the app really ships, not only the version catalog. An alert is an advisory
# match to triage (is the code reachable?), not a confirmed exploit.
name: Android dependencies

on:
  push:
    branches: [main]
    paths: ["android/**"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: android-dependencies
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android
          dependency-graph-include-configurations: releaseRuntimeClasspath
