# Dependabot version updates: one weekly pull request per ecosystem (minor and patch
# updates grouped; major updates come one by one, they may need code changes).
# Security updates (Settings -> Code security -> Dependabot security updates) open
# their own pull requests as soon as an advisory is published, whatever this schedule.
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "backend"
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "web"
    groups:
      web:
        update-types: [minor, patch]

  # API types generator (gen:api): openapi-typescript uses the TypeScript 5 compiler
  # API, gone from TypeScript 7, so TypeScript stays on 5 there.
  - package-ecosystem: npm
    directory: /web/tools/openapi
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "web"
    groups:
      openapi:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "android"
    groups:
      android:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types: [minor, patch]
