# Development: builds the image from this checkout.
#   docker compose -f docker-compose-dev.yml up --build
# Separate project name and data folder (./data-dev) so it never shares containers or
# data with a deployment. First start creates the administrator admin / changeme.
# All settings come from .env (documented in .env.example).
name: zukan-dev

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: tcg
    volumes:
      - ./data-dev/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://tcg:${POSTGRES_PASSWORD}@db:5432/tcg
      # Proxies trusted for X-Forwarded-For / -Proto (see .env.example).
      FORWARDED_ALLOW_IPS: ${TCG_FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ./data-dev/images:/data/images
      # Put downloaded image folders here (e.g. Sorcery Google Drive) to import them.
      - ./import:/data/import:ro
    ports:
      - "${ZUKAN_PORT:-8000}:8000"

  # Refreshes catalogs, prices and owned card images (TCG_SYNC_INTERVAL_HOURS).
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file: .env
    environment:
      TCG_DATABASE_URL: postgresql+asyncpg://tcg:${POSTGRES_PASSWORD}@db:5432/tcg
    volumes:
      - ./data-dev/images:/data/images
    command: ["python", "-m", "app.worker"]

networks:
  default:
    driver_opts:
      # See docker-compose.yml.
      com.docker.network.driver.mtu: ${TCG_NETWORK_MTU:-1420}
