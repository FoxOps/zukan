[project]
name = "zukan"
version = "0.20.0"
description = "Zukan (図鑑, illustrated encyclopedia): self-hosted TCG collection manager"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "pillow>=11.0",
    # Simplified <-> Traditional Chinese, to match scanned names in either script.
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

# Game providers are discovered through this entry point group.
# A new game is a package exposing a GameProvider and registering here.
[project.entry-points."zukan.games"]
mtg = "app.games.mtg:provider"
pokemon = "app.games.pokemon:provider"
pokemon-asia = "app.games.pokemon:asia_provider"
pokemon-china = "app.games.pokemon:china_provider"
sorcery = "app.games.sorcery:provider"
lorcana = "app.games.lorcana:provider"
riftbound = "app.games.riftbound:provider"
yugioh = "app.games.yugioh:provider"
yugioh-ocg = "app.games.yugioh:ocg_provider"

[project.entry-points."zukan.prices"]
cardmarket = "app.prices.cardmarket:source"
tcgplayer = "app.prices.tcgplayer:source"
cardnexus = "app.prices.cardnexus:source"

# Card databases covering several games, filling what each game's own sources lack.
[project.entry-points."zukan.sources"]
tcgcsv = "app.sources.tcgcsv:source"
tcgapi_eu = "app.sources.tcgapi_eu:source"
apitcg = "app.sources.apitcg:source"
cardnexus = "app.sources.cardnexus:source"

[project.scripts]
zukan = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.games.pokemon" = ["*.json"]
"*" = ["rarities/*.svg", "rarities/*.png", "symbols/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "smoke: critical paths, run by the fast dev CI build (pytest -m smoke)",
    "gap_sources: keep the generic gap-filling sources on (off by default in tests)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
# Pages written like the official sites' (long lines).
"tests/test_official_asia.py" = ["E501"]
