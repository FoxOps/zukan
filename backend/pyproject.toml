[project]
name = "fudabako"
version = "0.2.0"
description = "Fudabako (札箱, card box): self-hosted TCG collection manager"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

# Game providers are discovered through this entry point group.
# A new game is a package exposing a GameProvider and registering here.
[project.entry-points."fudabako.games"]
mtg = "app.games.mtg:provider"
pokemon = "app.games.pokemon:provider"
sorcery = "app.games.sorcery:provider"

[project.scripts]
fudabako = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "smoke: critical paths, run by the fast dev CI build (pytest -m smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
