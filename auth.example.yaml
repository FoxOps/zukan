# Copy to auth.yaml and set TCG_AUTH_CONFIG_PATH (docker compose mounts it for you).
# Any OpenID Connect provider works. ${VAR} is replaced from the environment.

# Turn off username/password login once SSO works (keep one admin path in mind!).
local_login_enabled: true

providers:
  - name: home                      # used in URLs: /api/auth/oidc/home/callback
    display_name: Home SSO          # login button label
    issuer: https://sso.example.com/realms/home
    client_id: tcg-web              # confidential client used by the web UI
    client_secret: ${OIDC_HOME_SECRET}
    mobile_client_id: tcg-android   # public client (PKCE) used by the Android app
    scopes: [openid, profile, email]  # Authelia also needs: groups (see docs/sso.md)
    username_claim: preferred_username
    groups_claim: groups
    admin_groups: [tcg-admins]      # optional: role synced from groups on each login
    allowed_groups: []              # optional: refuse users outside these groups
    auto_create_users: true
